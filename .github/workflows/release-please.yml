name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v3
        with:
          release-type: simple
          package-name: lux-config.nvim
          signoff: "Marc Jakobi<marc@jakobi.dev>"
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
